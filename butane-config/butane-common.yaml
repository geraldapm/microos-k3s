variant: fcos
version: 1.5.0
passwd:
  users:
      ### Generate password -> openssl passwd -6 -salt "12345"
    - name: root
      password_hash: $6$test$rqVNhXeFVHA3yzsfap9jTZMTkLuPQpsQMF2HWUfpcXYKyP9IPgte4frtqcgvNChjljNZVI1ygiG/q8xGUKJWp0
    - name: gerald
      password_hash: $6$test$rqVNhXeFVHA3yzsfap9jTZMTkLuPQpsQMF2HWUfpcXYKyP9IPgte4frtqcgvNChjljNZVI1ygiG/q8xGUKJWp0
      home_dir: /var/home/gerald
      no_create_home: false
storage:
  files:
    - path: /etc/profile.d/opt-path.sh
      contents:
        inline: |
          export PATH=$PATH:/var/opt/bin
    ### Initial Node IP
    - path: /etc/hostname
      overwrite: true
      mode: 0644
      contents:
        inline: |-
          ###HOSTNAME###
    ### The default interface naming is enp1s0
    - path: /etc/NetworkManager/system-connections/enp1s0.nmconnection
      mode: 0600
      contents:
        inline: |
          [connection]
          id=eth0
          type=ethernet
          interface-name=eth0
          [ipv4]
          address1=###IP_ADDRESS###/###CIDR###,###IP_GATEWAY###
          dns=###IP_GATEWAY###
          method=manual
          [ipv6]
          method=auto
    - path: /etc/hosts
      mode: 0644
      overwrite: true
      contents:
        inline: |
          127.0.0.1 localhost localhost.localdomain
          ::1		localhost localhost.localdomain ipv6-localhost ipv6-loopback

          ###IP_ADDRESS### ###HOSTNAME### ###HOSTNAME###.local ###HOSTNAME###.gpm.my.id
